# 部署在 AWS 服务器上的 docker-compose 文件。
# GitHub Actions 每次部署时会把这个文件和自动生成的 .env 一起
# 上传到服务器的 ~/apps/1000h-portal/ 目录,然后执行:
#   docker compose pull && docker compose up -d
#
# 本地也可以直接用它来手动验证:
#   IMAGE=ghcr.io/xxx/xxx:1000h-portal-latest docker compose up -d
services:
  portal:
    image: ${IMAGE}
    container_name: 1000h-portal
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8100}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - shared-nginx

networks:
  default: {}
  # huaxia-qiji 的 nginx 通过这个网络按容器名(1000h-portal)反代到这里,
  # 域名/路径是 https://5ways.duckdns.org/every1english/ ,配置在服务器上
  # ~/huaxia-qiji/nginx.conf 里。这里必须显式声明,否则每次 `docker compose
  # up -d` 重建容器时会丢掉这层网络关系,导致 nginx 解析不到这个容器名而崩溃重启
  # (2026-08-04 实测踩过这个坑)。
  shared-nginx:
    external: true
    name: huaxia-qiji_huaxia_network_dev
